name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 缺失依赖按用户要求：先从 GitHub 仓库源码构建产物
  residence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Zrips/Residence
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build Residence 6.0.2.2
        run: mvn -B -q package -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Denforcer.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: dep-residence
          path: target/Residence*.jar

  authme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NoobLLiu/AuthMeReReloaded
          ref: feat/agent-mail
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build AuthMe 5.7.0-FORK
        run: mvn -B -q package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: dep-authme
          path: target/AuthMe-5.7.0-FORK-Universal.jar

  mgteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NoobLLiu/MGTeam-JE
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build MGTeam 1.0.0
        run: bash ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dep-mgteam
          path: build/MGTeam-1.0.0.jar

  stockexchange:
    runs-on: ubuntu-latest
    needs: residence
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NoobLLiu/stockexchange-patched
          ref: master
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: dep-residence
          path: build/deps
      - name: Build StockExchange 1.0.0-gmzc
        run: bash ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dep-stockexchange
          path: build/StockExchange-1.0.0-gmzc.jar

  bridge:
    runs-on: ubuntu-latest
    needs: [residence, authme, mgteam, stockexchange]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Download dependency artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dep-*
          path: deps
          merge-multiple: true
      - name: Install dependencies into local Maven repository
        run: |
          mvn -B -q install:install-file -Dfile=deps/Residence*.jar -DgroupId=Residence -DartifactId=Residence -Dversion=6.0.2.2 -Dpackaging=jar
          mvn -B -q install:install-file -Dfile=deps/AuthMe-5.7.0-FORK-Universal.jar -DgroupId=fr.xephi.authme -DartifactId=authme -Dversion=5.7.0-FORK -Dpackaging=jar
          mvn -B -q install:install-file -Dfile=deps/MGTeam-1.0.0.jar -DgroupId=cn.gmzc.mgteam -DartifactId=mgteam -Dversion=1.0.0 -Dpackaging=jar
          mvn -B -q install:install-file -Dfile=deps/StockExchange-1.0.0-gmzc.jar -DgroupId=com.github.exchange -DartifactId=stockexchange -Dversion=1.0.0-gmzc -Dpackaging=jar
      - name: Build StarCityBridge
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: StarCityBridge
          path: target/StarCityBridge.jar
