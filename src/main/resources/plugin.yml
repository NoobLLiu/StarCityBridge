name: StarCityBridge
version: 0.1.0
main: com.starcity.bridge.StarCityBridge
api-version: '1.21'
authors: [StarCity]
description: StarCity 数据桥接插件：内建网页后端（HTTP REST），统一对接 AuthMe/市场/团队/领地等插件
website: https://github.com/NoobLLiu/StarCityBridge
softdepend: [AuthMe, StockExchange, MGTeam, Residence]

commands:
  site:
    description: 网站账户相关命令（绑定状态 / 重置网站密码）
    usage: /site <bind|resetpw <新密码>>
    aliases: [web]

permissions:
  starcitybridge.site.bind:
    description: 查看网站账户绑定状态
    default: true
  starcitybridge.site.resetpw:
    description: 在游戏内重置网站密码
    default: true