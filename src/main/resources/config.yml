# StarCityBridge 数据整合插件配置
backend:
  # 网站后端 WebSocket 地址（插件网关）
  url: "ws://localhost:8080/api/ws/plugin"
  # 插件令牌，须与网站后端 .env 中的 PLUGIN_TOKEN 一致
  token: "change_me_plugin_token"
  # 断线重连间隔（秒）
  reconnect-delay-seconds: 5
  # 心跳间隔（秒）
  heartbeat-seconds: 20

modules:
  authme:
    # 登录插件（AuthMe）对接开关
    enabled: true
# 连接模式：server=插件监听端口等待网站后端连接（反向模式，推荐，后端不需要公网）
#          client=插件主动连接后端（旧模式，后端需要公网）
connection:
  mode: server

# 反向模式服务端配置
server:
  host: 0.0.0.0
  port: 8082
  path: /ws

# 静音模式：true 时 /site 命令不再返回消息（重启后仍生效），再次 /site mute 恢复
settings:
  quiet_mode: false

# 一致性备份：
# 在线时只执行 Bukkit/Paper 的完整保存；到备份周期后由服务器内部正常停服。
# start.bat 会在所有插件和数据库关闭后制作、校验冷镜像，再自动重新开服。
consistent-backup:
  enabled: false
  autosave-interval-minutes: 20
  daily-time: "06:00"
  retry-minutes: 60
  cold-snapshot-root: "E:\\StarCity-Backup\\StarCity-ColdRecovery"

# 网页后端（由插件直接对外提供 HTTP REST API，替代旧 Go 后端转发）
web-api:
  # 是否启用插件内建的 HTTP REST 后端
  enabled: true
  # 监听地址与端口（前端直接访问）
  host: 0.0.0.0
  port: 8083
  # 玩家令牌 HMAC 签名密钥（请修改为随机长字符串）
  token-secret: "change_me_web_api_secret"
  # 玩家令牌有效期（秒）
  token-ttl-seconds: 3600
  # 管理员接口令牌（前端放 X-Admin-Token 头，或 query 参数 admin_token）
  admin-token: "change_me_admin_token"
  # 允许的 CORS 源（* 表示任意，生产环境建议改成前端域名）
  cors-origin: "*"

